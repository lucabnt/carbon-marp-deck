name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, theme sync, syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -m py_compile scripts/*.py tools/*.py pptx-export/dom/*.py
      - name: JavaScript syntax
        run: |
          node --check pptx-export/dom/extract.js
          node --check pptx-export/dom/page_extract.js
      - name: Allowlist is valid JSON
        run: python -c "import json; json.load(open('themes/marp.config.json'))"
      - name: Decks lint clean, CSS in sync
        run: python tools/check_examples.py --no-pptx

  pptx:
    name: PPTX regression (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pptx-export/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pptx-export/dom/package-lock.json
      - name: Python packages
        run: pip install -r pptx-export/requirements.txt
      - name: Converter packages (pinned)
        working-directory: pptx-export/dom
        run: npm ci --no-audit --no-fund
      - name: Let Chrome use its sandbox on Ubuntu runners
        if: runner.os == 'Linux'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Prerequisites
        run: python scripts/check_env.py
      - name: Convert examples and compare with tests/baseline.json
        run: python tools/check_examples.py
